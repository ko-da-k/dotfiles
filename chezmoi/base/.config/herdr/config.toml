onboarding = false
[keys]
last_pane = "prefix+;"

previous_workspace = "prefix+("
next_workspace = "prefix+)"
switch_workspace = "prefix+alt+1..9"

previous_agent = "prefix+ctrl+("
next_agent = "prefix+ctrl+)"
focus_agent = "prefix+ctrl+1..9"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-zsh}\""
description = "temp shell"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = '''printf 'agent name: '; read -r name; [ -z "$name" ] || "$HERDR_BIN_PATH" agent rename "$HERDR_ACTIVE_PANE_ID" "$name" >/dev/null || { printf 'press enter to close'; read -r _; }'''
description = "rename agent"
width = 50
height = 5

[ui]
prompt_new_workspace_name = true
