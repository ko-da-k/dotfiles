onboarding = false
[keys]
last_pane = "prefix+;"

previous_workspace = "prefix+("
next_workspace = "prefix+)"
switch_workspace = "prefix+alt+1..9"

previous_agent = "prefix+ctrl+("
next_agent = "prefix+ctrl+)"
focus_agent = "prefix+ctrl+1..9"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-zsh}\""
description = "temp shell"
width = "80%"
height = "80%"
