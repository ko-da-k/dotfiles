onboarding = false
[keys]
last_pane = "prefix+;"

previous_workspace = "prefix+("
next_workspace = "prefix+)"
switch_workspace = "prefix+alt+1..9"

previous_agent = "prefix+ctrl+("
next_agent = "prefix+ctrl+)"
focus_agent = "prefix+ctrl+1..9"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-zsh}\""
description = "temp shell"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "agent-name.rename"
description = "rename agent"

[ui]
prompt_new_workspace_name = true

# $cwd は shell の hook（zsh / nushell）が workspace の先頭 pane の cwd 末尾 2 要素を報告する
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["$cwd"],
  ["branch", "git_status"],
]
