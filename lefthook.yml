# lefthook (https://github.com/evilmartians/lefthook) の Git pre-commit hook 設定。
# ファイルを検査する job は {staged_files} を使い、Git index の内容を対象にする。
#
# lefthook に builtin フックは無いため、各検査は run のシェルで実装する。
# ここでは外部ランタイムに依存しない POSIX sh のみで書いている。
# 設定の検証は `lefthook validate`、正規化後の確認は `lefthook dump`。
pre-commit:
  parallel: true
  jobs:
    # ファイルを受け取らず、pre-commit hook ごとに repository 全体を確認する。
    - name: chezmoi-status
      run: chezmoi status

    # glob で対象を絞る例。{staged_files} は lefthook がクォートして展開するので
    # スペースを含むパスでも壊れない。
    - name: trailing-whitespace
      tags: [style]
      glob: "*.{md,toml,yaml,yml,json,nix,nu,sh,bash,zsh}"
      # BSD grep では [ \t] が「空白 / バックスラッシュ / 文字 t」の
      # 文字クラスとして解釈され t で終わる行を誤検知する。
      # POSIX 文字クラス [[:blank:]] を使うこと。
      run: |
        if grep -nE '[[:blank:]]+$' {staged_files}; then
          echo "==> 行末に空白があります" >&2
          exit 1
        fi

    # exclude で除外する例。glob はサブディレクトリのパスにも効くので
    # "*.lock" だけで flake.lock も sub/foo.lock も除外される。
    - name: eof-newline
      tags: [style]
      exclude:
        - "*.lock"
      run: |
        status=0
        for f in {staged_files}; do
          if [ -s "$f" ] && [ "$(tail -c1 "$f" | wc -l)" -eq 0 ]; then
            echo "$f: 末尾に改行がありません" >&2
            status=1
          fi
        done
        exit $status

    # glob 無し = 渡された全ファイルが対象。
    - name: detect-private-key
      tags: [security]
      run: |
        if grep -nE 'BEGIN [A-Z ]*PRIVATE KEY' {staged_files}; then
          echo "==> 秘密鍵らしき文字列が含まれています" >&2
          exit 1
        fi
