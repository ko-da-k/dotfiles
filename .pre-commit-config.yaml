# prek (https://github.com/j178/prek) の Git pre-commit hook 設定。
# 通常の hook は Git が選択したファイルを検査し、always_run hook は
# 対象ファイルの有無にかかわらず実行される。
#
# repo: builtin は prek 組み込みの Rust 実装フックで、ネットワーク・外部ランタイム不要。
# repo: local は repository 固有のチェック用。
# 一覧: https://prek.j178.dev/builtin/
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
  - repo: local
    hooks:
      - id: chezmoi-status
        name: chezmoi status
        entry: chezmoi status
        language: system
        pass_filenames: false
        always_run: true
